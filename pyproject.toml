[project]
name = "sto-network"
version = "2.0.0"
description = "Multi-tenant workshop management for auto service-station networks (FastAPI + SQLModel)."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mykhailo Zvir" }]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends()/Form() in defaults is the framework idiom
  "RUF001", "RUF002", "RUF003",  # Ukrainian text and typographic quotes are intentional
  "SIM108", "SIM103",
  "UP047",   # explicit TypeVar keeps the signature readable for mypy users on 3.12
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S608", "E501", "B017", "SIM118", "RUF005"]
"app/demo.py" = ["S311", "S105", "S101"]
"app/i18n_strings.py" = ["E501"]          # synthetic data uses a seeded PRNG; the demo password is public by design
"scripts/**" = ["S311", "T201", "S105", "S101", "S603"]   # dev helpers: fixed argv, own interpreter

[tool.ruff.lint.isort]
known-first-party = ["app", "ai", "integrations", "tg_bot", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^tests/", "^scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app", "ai", "integrations"]
omit = ["app/manage.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
