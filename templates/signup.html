{% extends "auth_base.html" %}
{% block title %}{{ t('signup.title') }}{% endblock %}
{% block auth %}
<div class="auth-grid">
  <section class="box wide">
    <h1>{{ t('signup.title') }}</h1>
    <p class="muted">{{ t('signup.sub') }}</p>
    {% include "_flash.html" %}
    <form method="post" action="/signup" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field"><label for="org_name">{{ t('signup.org') }}</label>
        <input id="org_name" name="org_name" required maxlength="120" value="{{ form.org_name or '' }}"></div>
      <div class="frow c2">
        <div class="field"><label for="admin_name">{{ t('signup.admin') }}</label>
          <input id="admin_name" name="admin_name" required maxlength="120" autocomplete="name" value="{{ form.admin_name or '' }}"></div>
        <div class="field"><label for="email">{{ t('field.email') }}</label>
          <input id="email" name="email" type="email" required autocomplete="email" value="{{ form.email or '' }}"></div>
      </div>
      <div class="field"><label for="password">{{ t('field.password') }}</label>
        <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password" aria-describedby="pw-hint">
        <small id="pw-hint" class="faint">{{ t('signup.pw_hint') }}</small></div>
      <div class="frow c3">
        <div class="field span2"><label for="branch_name">{{ t('signup.branch') }}</label>
          <input id="branch_name" name="branch_name" required maxlength="120" value="{{ form.branch_name or '' }}"></div>
        <div class="field"><label for="prefix">{{ t('signup.prefix') }}</label>
          <input id="prefix" name="prefix" maxlength="4" placeholder="KYI" value="{{ form.prefix or '' }}"></div>
      </div>
      <div class="field"><label for="region">{{ t('field.region') }}</label>
        <input id="region" name="region" maxlength="80" value="{{ form.region or '' }}"></div>
      <button class="btn pri lg block">{{ t('signup.submit') }}</button>
    </form>
    <p class="muted small center">{{ t('signup.have') }} <a href="/login">{{ t('login.title') }}</a></p>
  </section>
</div>
{% endblock %}
